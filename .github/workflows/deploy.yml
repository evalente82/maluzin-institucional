name: Deploy to GitHub Pages

# Grant Actions token the permissions required to push and manage Pages
permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true # ensure GITHUB_TOKEN is available for subsequent git push
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite requires Node >= 20.19; use Node 20.x in CI
          node-version: '20'
      - name: Install deps
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: 'github-actions'
          user_email: 'actions@github.com'
